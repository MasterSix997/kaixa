[package]
name = "kaixa"
version = "0.2.0-dev"
resolver = "cmake"
tests = ["tests"]
examples = ["examples"]
benchmarks = ["benchmarks"]

[package-set]
name = "kaixa"

[package-set.policy]
cxx = 23
msvc-runtime = "static"

[dependencies]
kaixa_core = "0.2.0-dev"
kaixa_plugins = "0.2.0-dev"

[bin]
sources = ["apps/kaixa/*.cpp", "apps/kaixa/command_line.cpp"]

[cmake]
languages = ["CXX"]
msvc-runtime = "static"
output = { runtime = "bin", library = "lib", archive = "lib" }

[command.quality]
run = "python tools/quality.py rules format complexity"
inputs = ["tools/quality.py", "tools/complexity-baseline.txt"]

[command.format-check]
run = "python tools/quality.py format --all-files"
inputs = ["tools/quality.py"]

[command.tidy]
after = ["build"]
run = "python tools/quality.py tidy"
inputs = ["tools/quality.py"]

[workflow.dev]
steps = ["generate", "quality", "build", "test"]

[workflow.ci]
steps = ["generate", "quality", "build", "test", "tidy"]

[workflow.performance]
steps = ["generate", "build", "bench"]

[[config]]
name = "quality"

[config.cmake]
configure-arguments = ["-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"]

[members.kaixa_core]
version = "0.2.0-dev"
resolver = "cmake"

[members.kaixa_core.cmake]
languages = ["C", "CXX"]

[members.kaixa_core.lib]
type = "static"
sources = ["src/**/*.cpp", "third_party/miniz/miniz.c"]
public-include = ["include"]
system-include = ["third_party"]
defines = { TOML_EXCEPTIONS = 0 }

[members.kaixa_plugins]
version = "0.2.0-dev"
resolver = "cmake"

[members.kaixa_plugins.dependencies]
kaixa_core = "0.2.0-dev"

[members.kaixa_plugins.lib]
type = "static"
sources = ["plugins/**/*.cpp"]
include = ["plugins/cmake/src"]
public-include = [
    "plugins/bundle/include",
    "plugins/cmake/include",
    "plugins/path/include",
    "plugins/remote/include",
    "plugins/registry/include",
]
